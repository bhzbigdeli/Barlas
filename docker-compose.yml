# اجرای کامل روی سرور کارخانه: SQL Server + API + وب.
# قبل از اجرا: cp .env.example .env و مقادیر را عوض کنید.
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${DB_SA_PASSWORD:?DB_SA_PASSWORD}
    volumes:
      - sqldata:/var/opt/mssql
    ports:
      - "1433:1433"
    restart: unless-stopped

  api:
    build: ./backend
    depends_on:
      - db
    environment:
      ConnectionStrings__Barlas: "Server=db,1433;Database=Barlas;User Id=sa;Password=${DB_SA_PASSWORD};TrustServerCertificate=True"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY}
      Seed__AdminPassword: ${ADMIN_PASSWORD:?ADMIN_PASSWORD}
      Seed__MainSupplierCode: ${MAIN_SUPPLIER_CODE:-SUP-MAIN}
      Seed__SandalSupplierCode: ${SANDAL_SUPPLIER_CODE:-SUP-SANDAL}
    restart: unless-stopped

  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-80}:80"
    restart: unless-stopped

volumes:
  sqldata:
